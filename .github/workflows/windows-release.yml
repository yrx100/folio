name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version" -and "$($env:GITHUB_REF_NAME).0" -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match package.json version v$version"
          }
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $compilerDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          $expectedHash = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          if ((Get-FileHash -LiteralPath $setup).Hash -ne $expectedHash) { throw 'Inno Setup hash mismatch' }
          $installer = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',('/DIR="' + $compilerDir + '"') -WindowStyle Hidden -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Inno Setup installation failed: $($installer.ExitCode)" }
          ./package.ps1 -InnoCompiler (Join-Path $compilerDir 'ISCC.exe')
      - name: Verify installation and Explorer shortcuts
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $target = Join-Path $env:RUNNER_TEMP 'FolioSmoke'
          $setup = Start-Process "dist/Folio-Setup-$version-x64.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=explorer',('/DIR="' + $target + '"') -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or !(Test-Path "$target\Folio.exe")) { throw 'Folio installation failed' }
          $background = 'HKCU:\Software\Classes\Directory\Background\shell\ProjectNotesLite.Edit\command'
          $expected = '"' + $target + '\Folio.exe" --edit "%V\."'
          if ((Get-Item -LiteralPath $background).GetValue('') -ne $expected) { throw 'Missing Explorer background shortcut' }
          $uninstall = Start-Process "$target\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path -LiteralPath $background)) { throw 'Folio uninstallation failed' }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = $env:GITHUB_REF_NAME
          $installer = "dist/Folio-Setup-$version-x64.exe"
          gh release create $tag $installer "$installer.sha256" --verify-tag --title "Folio $($tag.TrimStart('v'))" --latest --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publishing failed" }
